version: 0.21.0

# Lint only the Ymir agent prompts. The agents_as_skills/ skills, the skills/
# directory, and the root AGENTS.md are being deprecated, so exclude them (and
# the .claude plugin) and pull in the Jinja2 prompt templates via content-paths.
exclude:
  - "agents_as_skills/**"
  - "skills/**"
  - ".claude/**"
  - "AGENTS.md"

content-paths:
  - "ymir/agents/prompts/**/*.j2"

rules:
  # Prompts use ALL-CAPS pseudo-headings and are assembled from Jinja fragments,
  # so the markdown-heading-based chunking and section-length heuristics do not
  # map to them and produce only "no headings / top of file" noise.
  content-cognitive-chunks:
    exclude:
      - "ymir/agents/prompts/**"
  content-section-length:
    exclude:
      - "ymir/agents/prompts/**"
